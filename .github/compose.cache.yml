# GitHub CI only (COMPOSE_FILE in ci.yml): the suites' image layers in the Actions cache, one scope per
# image, so a job rebuilds only the layers its change touched.
services:
  ci-ts:
    build:
      cache_from: ["type=gha,scope=ci-ts"]
      cache_to: ["type=gha,mode=max,scope=ci-ts"]
  ci-python:
    build:
      cache_from: ["type=gha,scope=ci-python"]
      cache_to: ["type=gha,mode=max,scope=ci-python"]
  ci-scripts:
    build:
      cache_from: ["type=gha,scope=ci-scripts"]
      cache_to: ["type=gha,mode=max,scope=ci-scripts"]
