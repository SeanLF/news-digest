# The tests and the dependency scan on every push to main, and on Dependabot's PRs, which never pass
# through the Mac's pre-commit hook. Not a deploy gate: make deploy runs osv-scanner itself.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  # The repo's own CI (bin/ci): the TypeScript, Python worker and bin/ scripts suites, each in its container.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bin/ci

  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # A Dependabot PR's token is read-only, so it cannot upload to Code Scanning.
      upload-sarif: ${{ github.event_name != 'pull_request' }}
      scan-args: |-
        --lockfile=digest/package-lock.json
        --lockfile=digest/python/uv.lock
