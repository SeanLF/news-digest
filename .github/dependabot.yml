# Weekly update PRs; ci.yml runs the tests and osv-scanner on each. Merging one is not deploying it:
# make deploy ships main when Sean runs it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /digest
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # The Temporal SDK's packages must share one version; a split bump fails at worker start.
      temporal:
        patterns: ["@temporalio/*"]
      minor-and-patch:
        update-types: [minor, patch]

  # bin/web-check's tools.
  - package-ecosystem: npm
    directory: /web-check
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The eval runner (promptfoo); its own lock, outside the deploy's osv-scanner scan.
  - package-ecosystem: npm
    directory: /evals
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # promptfoo's codex-sdk provider accepts only ^0.156.1 (bin/tests/test_codex_judge_pins.py);
    # the pin moves with promptfoo, by hand.
    ignore:
      - dependency-name: "@openai/codex-sdk"
        versions: [">= 0.157.0"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /digest/python
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/digest, /digest/python, /bin/tests, /web-check]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
